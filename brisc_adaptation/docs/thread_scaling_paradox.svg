<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Thread scaling paradox: more threads, less throughput</title>
  <style>
    .h1 { font-size: 20px; font-weight: bold; fill: #111827; }
    .sub { font-size: 13px; fill: #4b5563; }
    .t { font-size: 15px; font-weight: bold; fill: #111827; }
    .d { font-size: 13px; fill: #374151; }
    .ax { font-size: 13px; fill: #374151; }
    .note { font-size: 11px; font-style: italic; fill: #6b7280; }
    .lblA { font-size: 13px; font-weight: bold; fill: #0072b2; }
    .lblB { font-size: 13px; font-weight: bold; fill: #d55e00; }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker>
  </defs>

  <rect x="0" y="0" width="960" height="420" fill="#ffffff"/>

  <!-- Header -->
  <text x="480" y="36" class="h1" text-anchor="middle">The thread-scaling paradox</text>
  <text x="480" y="58" class="sub" text-anchor="middle">Doubling worker threads made the per-perturbation loop at least 10x slower</text>

  <!-- ============ LEFT PANEL: throughput curve ============ -->
  <text x="250" y="92" class="t" text-anchor="middle">Throughput peaks, then falls</text>

  <!-- axes: origin (80,340), x to 440, y to 110 -->
  <line x1="80" y1="340" x2="445" y2="340" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="80" y1="340" x2="80" y2="108" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="262" y="366" class="ax" text-anchor="middle">worker threads</text>
  <text x="0" y="0" class="ax" text-anchor="middle" transform="translate(56,225) rotate(-90)">throughput (perturbations/min)</text>

  <!-- ideal linear scaling (dashed) -->
  <line x1="80" y1="340" x2="185" y2="112" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="174" y="118" class="note" text-anchor="end">ideal (linear)</text>

  <!-- retrograde curve -->
  <path d="M80,340 C140,230 200,160 270,155 C330,152 380,230 430,300" fill="none" stroke="#009e73" stroke-width="3"/>

  <!-- run A near peak -->
  <circle cx="268" cy="155" r="6" fill="#0072b2" stroke="#ffffff" stroke-width="1.5"/>
  <text x="268" y="138" class="lblA" text-anchor="middle">96×2 (run A)</text>

  <!-- run B on falling side -->
  <circle cx="414" cy="281" r="6" fill="#d55e00" stroke="#ffffff" stroke-width="1.5"/>
  <text x="416" y="312" class="lblB" text-anchor="end">192×1 (run B)</text>

  <text x="440" y="386" class="note" text-anchor="end">conceptual shape, not measured</text>

  <!-- divider -->
  <line x1="490" y1="84" x2="490" y2="396" stroke="#e5e7eb" stroke-width="1.5"/>

  <!-- ============ RIGHT PANEL: shared bottlenecks ============ -->
  <text x="725" y="92" class="t" text-anchor="middle">All threads share two bottlenecks</text>

  <!-- threads column -->
  <g fill="#dcebf7" stroke="#0072b2" stroke-width="1.2">
    <rect x="515" y="120" width="62" height="20" rx="4"/>
    <rect x="515" y="148" width="62" height="20" rx="4"/>
    <rect x="515" y="176" width="62" height="20" rx="4"/>
    <rect x="515" y="204" width="62" height="20" rx="4"/>
    <rect x="515" y="232" width="62" height="20" rx="4"/>
    <rect x="515" y="260" width="62" height="20" rx="4"/>
    <rect x="515" y="288" width="62" height="20" rx="4"/>
    <rect x="515" y="316" width="62" height="20" rx="4"/>
  </g>
  <text x="546" y="360" class="d" text-anchor="middle">many threads</text>
  <text x="546" y="377" class="d" text-anchor="middle">(one process)</text>

  <!-- funnel lines from threads to bottlenecks -->
  <g stroke="#9ca3af" stroke-width="1.2" fill="none">
    <path d="M577,130 L660,175"/>
    <path d="M577,158 L660,180"/>
    <path d="M577,186 L660,185"/>
    <path d="M577,214 L660,190"/>
    <path d="M577,242 L660,280"/>
    <path d="M577,270 L660,285"/>
    <path d="M577,298 L660,290"/>
    <path d="M577,326 L660,295"/>
  </g>

  <!-- GIL gate -->
  <rect x="660" y="150" width="120" height="70" rx="8" fill="#fcebcc" stroke="#e69f00" stroke-width="1.5"/>
  <text x="720" y="180" class="t" text-anchor="middle">GIL</text>
  <text x="720" y="200" class="d" text-anchor="middle">one at a time</text>
  <line x1="780" y1="185" x2="808" y2="185" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="812" y="180" class="d">Python glue,</text>
  <text x="812" y="197" class="d">small ops</text>

  <!-- memory bandwidth pipe -->
  <rect x="660" y="262" width="120" height="56" rx="8" fill="#f5e1ec" stroke="#cc79a7" stroke-width="1.5"/>
  <text x="720" y="287" class="t" text-anchor="middle">memory</text>
  <text x="720" y="306" class="t" text-anchor="middle">bandwidth</text>
  <line x1="780" y1="290" x2="808" y2="290" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="812" y="285" class="d">fixed per socket;</text>
  <text x="812" y="302" class="d">rank matrices,</text>
  <text x="812" y="319" class="d">dense residuals</text>

  <text x="725" y="404" class="d" text-anchor="middle">More threads = longer queues, not more work done</text>
</svg>
